services:
  migrate:
    build: .
    environment: &app_env
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: threshold
      DB_USERNAME: threshold
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    depends_on:
      postgres:
        condition: service_healthy
    command: php artisan migrate --force

  app:
    build: .
    ports:
      - "8000:8000"
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: php artisan serve --host=0.0.0.0 --port=8000

  queue:
    build: .
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: php artisan queue:work --tries=3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threshold
      POSTGRES_USER: threshold
      POSTGRES_PASSWORD: secret
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threshold"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
