services:
  migrate:
    build: .
    environment: &app_env
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: threshold
      DB_USERNAME: threshold
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    depends_on:
      postgres:
        condition: service_healthy
    command: php artisan migrate --force

  app:
    build: .
    ports:
      - "8000:8000"
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Not `php artisan serve`: its wrapper process only passes an allowlist of env vars
    # (APP_ENV, PATH, XDEBUG_*, ...) through to the child process that actually handles
    # requests — DB_CONNECTION and friends aren't in it, so the request-handling process
    # silently falls back to whatever's baked into the .env file. Invoking PHP's built-in
    # server directly makes the container's real environment (set above) the one PHP sees.
    command: sh -c "cd public && php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"

  queue:
    build: .
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: php artisan queue:work --tries=3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threshold
      POSTGRES_USER: threshold
      POSTGRES_PASSWORD: secret
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threshold"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
