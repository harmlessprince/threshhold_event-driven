services:
  # PHP Service
  app:
    build:
      args:
        user: threshold
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: threshold-app
    container_name: threshold-app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker-compose/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - threshold-network
    # Healthy once `composer install` has actually populated vendor/ — queue waits on
    # this instead of starting immediately and crash-looping until it's true.
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/vendor/autoload.php"]
      interval: 5s
      timeout: 3s
      retries: 60

  # Queue worker — same image as app, just runs queue:work instead of php-fpm.
  # Processes TriggerCashback, which is deliberately queued (see README).
  queue:
    image: threshold-app
    container_name: threshold-queue
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker-compose/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_started
    command: php artisan queue:work --tries=3
    networks:
      - threshold-network

  # Nginx Service
  webserver:
    image: nginx:alpine
    container_name: threshold-server
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - threshold-network

  # Postgres Service
  db:
    image: postgres:16-alpine
    container_name: threshold-db
    restart: unless-stopped
    tty: true
    ports:
      - "5439:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: threshold
      POSTGRES_USER: threshold
      POSTGRES_PASSWORD: password
    networks:
      - threshold-network

  adminer:
    image: adminer
    container_name: threshold-adminer
    restart: unless-stopped
    ports:
      - "8201:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - threshold-network

# Volumes
volumes:
  dbdata:
    driver: local

# Docker Networks
networks:
  threshold-network:
    driver: bridge
